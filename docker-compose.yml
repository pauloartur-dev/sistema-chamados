services:
  db:
    image: postgres:16-alpine
    container_name: condodesk-db
    environment:
      POSTGRES_DB: condominio_db
      POSTGRES_USER: condominio_user
      POSTGRES_PASSWORD: condominio_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U condominio_user -d condominio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: condodesk-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/condominio_db
      SPRING_DATASOURCE_USERNAME: condominio_user
      SPRING_DATASOURCE_PASSWORD: condominio_pass
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
